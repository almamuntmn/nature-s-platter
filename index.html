<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natures Platter</title>
    <!-- tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <header class="bg-gradient-to-b from-[#FFFFFF] to-[#EFEBE3]">
        <nav class="container mx-auto flex my-4 justify-between items-center">
            <div><img src="./assets/nav-logo.png" alt=""></div>
            <ul class="flex gap-5 text-lg">
                <li>Product</li>
                <li>Services</li>
                <li>Contact Us</li>
            </ul>
            <div class="flex items-center gap-4">
                <div class="w-8"><img src="./assets/search.svg" alt=""></div>
                <div class="w-8"><img src="./assets/cart.svg" alt=""></div>
                <button class="border-2 border-green-500 py-2.5 px-7.5 rounded-lg">Login</button>
                <button
                    class="border-2 border-green-500 bg-green-500 text-white py-2.5 px-7.5 rounded-lg">Register</button>
            </div>
        </nav>
        <section class="container mx-auto">
            <div>
                <h1 class="text-center text-5xl font-semibold">Freshness <span class="text-green-500">You Can</span> <br>
                    <span class="text-green-500">Count</span> On, Prices You’ll Love!</h1>
                    <p class="text-center my-5 text-lg">Shop your daily essentials at unbeatable prices. <br>From fresh produce to pantry staples, we’ve got you covered every day!</p>
            </div>
            <div class="flex justify-center h-[700px]">
                <img src="./assets/Hero Section 1.png" alt="">
            </div>
        </section>
    </header>
</body>

</html>
